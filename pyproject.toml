[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "detecta"
dynamic = ["version"]
description = "Detect events in data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marcos Duarte", email = "duartexyz@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["numpy"]
keywords = ["peak detection", "onset detection", "cusum", "signal processing", "biomechanics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
plot = ["matplotlib"]
test = ["pytest", "matplotlib"]

[project.urls]
Homepage = "https://github.com/demotu/detecta"
Documentation = "https://github.com/demotu/detecta/tree/master/docs"
Issues = "https://github.com/demotu/detecta/issues"

[tool.setuptools]
packages = ["detecta"]

[tool.setuptools.dynamic]
version = { attr = "detecta.__version__" }

[tool.pytest.ini_options]
filterwarnings = ["error::DeprecationWarning:detecta", "ignore:.*non-interactive:UserWarning"]
